name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm numarası (v olmadan, örn. 0.1.0). Tag yoksa oluşturulur."
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release-apk:
    name: Release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional: add a RELEASE_KEYSTORE_BASE64 secret (plus the password
      # secrets below) to publish a properly signed APK. Without it the build
      # falls back to the debug key, which still installs on a phone.
      - name: Prepare signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MCCAM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          else
            echo "No release keystore configured, falling back to the debug key."
          fi

      - name: Assemble release APK
        env:
          MCCAM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MCCAM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MCCAM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MC-Camera-${VERSION}.apk"
          echo "path=dist/MC-Camera-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-camera-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # On a manual run the tag is created from the current commit, so a release
      # can be cut without pushing a tag by hand.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<'NOTES'
          Kamerayı canlı olarak Minecraft bloklarına çeviren Android uygulaması.

          ### Kurulum
          Aşağıdaki APK'yı indirip telefonuna kur. Bilinmeyen kaynaklardan
          kuruluma izin vermen gerekebilir. Android 8.0 ve üzeri gerekir.

          ### Bu sürümde
          - Gerçek zamanlı blok mozaiği (OpenGL ES 3.0 shader)
          - Ayarlanabilir blok yoğunluğu: 16 - 128 blok
          - Kendi resource pack zip dosyanı yükleme
          - Işık uyumu, ön/arka kamera, galeriye kaydetme
          NOTES

          # A previous run can leave an untagged draft behind; clear it so the
          # release below is the only one for this version.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft) | select(.tag_name == \"$TAG\" or .name == \"MC Camera $TAG\") | .id" \
            | while read -r id; do
                echo "Eski taslak siliniyor: $id"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --draft=false --latest \
              --title "MC Camera $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "MC Camera $TAG" \
              --notes-file release-notes.md \
              --latest
          fi

          gh release view "$TAG" --json tagName,isDraft,assets
