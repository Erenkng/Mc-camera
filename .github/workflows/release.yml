name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional: add a RELEASE_KEYSTORE_BASE64 secret (plus the password
      # secrets below) to publish a properly signed APK. Without it the build
      # falls back to the debug key, which still installs on a phone.
      - name: Prepare signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MCCAM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          else
            echo "No release keystore configured, falling back to the debug key."
          fi

      - name: Assemble release APK
        env:
          MCCAM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MCCAM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MCCAM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MC-Camera-${VERSION}.apk"
          echo "path=dist/MC-Camera-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-camera-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MC Camera ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            **MC Camera ${{ github.ref_name }}** — kamerayı canlı olarak Minecraft bloklarına çeviren Android uygulaması.

            ### Kurulum
            Aşağıdaki APK'yı indirip telefonuna kur. Bilinmeyen kaynaklardan kuruluma izin vermen gerekebilir.

            ### Bu sürümde
            - Gerçek zamanlı blok mozaiği (OpenGL ES 3.0 shader)
            - Ayarlanabilir blok yoğunluğu: 16 – 128 blok
            - Kendi resource pack `.zip` dosyanı yükleme
            - Işık uyumu, ön/arka kamera, galeriye kaydetme
